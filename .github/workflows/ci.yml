name: dt4acc-lib build

on:
  push:
    branches:
      - "dev/main"
  pull_request:
    branches:
      - dev/main"

jobs:
  wrap_and_build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          # - "3.10"
          # - "3.11"
          # - "3.12"
          - "3.13" 
        numpy-version : 
          # - "numpy<2.0"
          - "numpy>=2.0"
          
    steps:
      # Checkout the repository contents
      - name: Checkout dt4acc-lib
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }} ${{ matrix.numpy-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            **/pyproject.toml
            **/requirements*.txt

      # Install dependencies
      - name: Install apt dependencies
        run: |
          sudo apt-get install python3-dev python3-pip

      # Install Python dependencies
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install pytest pycodestyle flake8
          python -m pip install "${{ matrix.numpy-version }}"

      - name: wheel
        run: |
          python -m pip wheel -w wheel/ ./

      - name: install
        run: |
          # listing a non existing directory fails ..
          python -m pip install wheel/dt4acc-lib*.whl

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 src/dt4acc_lib --count --select=E9,F63,F7,F82 --show-source --statistics

          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 src/dt4acc_lib --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: test
        run: |
          # make sure to move out of the source directory
          cd /tmp
          python -m pytest -v -s "$GITHUB_WORKSPACE/tests"
